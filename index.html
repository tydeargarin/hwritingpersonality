<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Handwriting Big Five Personality Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        margin: 0;
        background: #020617;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }
      .container {
        max-width: 1200px;
        width: 100%;
        padding: 40px 24px 56px;
      }
      .card {
        background: #020617;
        border-radius: 20px;
        padding: 30px 30px 34px;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.35);
      }
      h1 {
        font-size: 30px;
        margin: 0 0 10px;
        color: #e5e7eb;
      }
      .subtitle {
        font-size: 15px;
        color: #9ca3af;
        margin-bottom: 24px;
        max-width: 900px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 24px;
        align-items: flex-start;
      }
      .upload-area {
        border: 1px dashed rgba(148, 163, 184, 0.8);
        border-radius: 16px;
        padding: 22px;
        text-align: center;
        background: rgba(15, 23, 42, 0.8);
        margin-bottom: 22px;
      }
      .upload-area.dragover {
        border-color: #38bdf8;
        background: rgba(15, 23, 42, 0.9);
      }
      .upload-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.6);
        cursor: pointer;
        color: #e5e7eb;
        font-size: 14px;
      }
      .upload-label span.icon {
        font-size: 16px;
      }
      .hint {
        font-size: 13px;
        color: #9ca3af;
        margin-top: 10px;
      }
      button {
        margin-top: 10px;
        padding: 10px 20px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #38bdf8, #6366f1);
        color: #0b1120;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .result {
        margin-top: 24px;
        border-top: 1px solid rgba(31, 41, 55, 0.9);
        padding-top: 20px;
      }
      .section-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 10px;
        color: #e5e7eb;
      }
      .traits-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px 14px;
        margin-top: 8px;
      }
      .trait-card {
        background: rgba(15, 23, 42, 0.95);
        border-radius: 14px;
        padding: 12px 14px;
        border: 1px solid rgba(30, 64, 175, 0.6);
      }
      .trait-name {
        font-size: 14px;
        font-weight: 600;
        color: #e5e7eb;
        margin-bottom: 4px;
        text-transform: capitalize;
      }
      .trait-score {
        font-size: 14px;
        color: #9ca3af;
        margin-bottom: 5px;
      }
      .bar-bg {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(31, 41, 55, 0.95);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #22c55e, #38bdf8);
        width: 0;
      }
      .error {
        margin-top: 12px;
        color: #f97373;
        font-size: 13px;
      }
      .filename {
        font-size: 12px;
        color: #9ca3af;
        margin-top: 6px;
        word-break: break-all;
      }
      .interpretation {
        margin-top: 18px;
        font-size: 14px;
        color: #9ca3af;
        line-height: 1.5;
      }
      .interpretation-title {
        font-weight: 600;
        color: #e5e7eb;
        margin-bottom: 6px;
      }
      .preview-card {
        background: rgba(15, 23, 42, 0.95);
        border-radius: 16px;
        padding: 16px 16px 18px;
        border: 1px solid rgba(55, 65, 81, 0.9);
      }
      .preview-title {
        font-size: 14px;
        font-weight: 600;
        color: #e5e7eb;
        margin-bottom: 8px;
      }
      #preview-image {
        width: 100%;
        max-height: 360px;
        object-fit: contain;
        border-radius: 12px;
        background: #020617;
        border: 1px solid rgba(31, 41, 55, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Big Five Personality from Handwriting</h1>
        <div class="subtitle">
          Upload a handwriting image. The system will preprocess it, extract
          graphology features, and estimate Big Five personality scores from
          your writing.
        </div>

        <div class="layout">
          <div>
            <div
              class="upload-area"
              id="drop-zone"
            >
              <input
                type="file"
                id="file-input"
                accept="image/*"
                style="display: none"
              />
              <label for="file-input" class="upload-label">
                <span class="icon">📄</span>
                <span>Select handwriting image</span>
              </label>
              <div class="hint">
                or drag and drop an image file here (e.g., .png, .jpg, .tif)
              </div>
              <div id="filename" class="filename"></div>
              <button id="analyze-btn" disabled>Analyze Personality</button>
              <div id="status" class="hint"></div>
              <div id="error" class="error"></div>

              <div id="results" class="result" style="display: none">
                <div class="section-title">Rule‑based Big Five Scores</div>
                <div id="traits" class="traits-grid"></div>
                <div id="interpretation" class="interpretation"></div>
              </div>
            </div>
          </div>
          <div>
            <div class="preview-card">
              <div class="preview-title">Handwriting Preview</div>
              <img id="preview-image" alt="Preview will appear here" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById("file-input");
      const dropZone = document.getElementById("drop-zone");
      const analyzeBtn = document.getElementById("analyze-btn");
      const filenameEl = document.getElementById("filename");
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const resultsEl = document.getElementById("results");
      const traitsEl = document.getElementById("traits");
      const interpretationEl = document.getElementById("interpretation");
      const previewImg = document.getElementById("preview-image");

      let selectedFile = null;

      function resetUI() {
        statusEl.textContent = "";
        errorEl.textContent = "";
        resultsEl.style.display = "none";
        traitsEl.innerHTML = "";
        interpretationEl.textContent = "";
      }

      fileInput.addEventListener("change", (e) => {
        resetUI();
        selectedFile = e.target.files[0] || null;
        if (selectedFile) {
          filenameEl.textContent = selectedFile.name;
          if (previewImg) {
            const url = URL.createObjectURL(selectedFile);
            previewImg.src = url;
          }
          analyzeBtn.disabled = false;
        } else {
          filenameEl.textContent = "";
          analyzeBtn.disabled = true;
        }
      });

      // Drag & drop support
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });
      dropZone.addEventListener("dragleave", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
      });
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        resetUI();
        const files = e.dataTransfer.files;
        if (files && files[0]) {
          selectedFile = files[0];
          filenameEl.textContent = selectedFile.name;
          if (previewImg) {
            const url = URL.createObjectURL(selectedFile);
            previewImg.src = url;
          }
          analyzeBtn.disabled = false;
        }
      });

      analyzeBtn.addEventListener("click", async () => {
        if (!selectedFile) return;
        resetUI();
        analyzeBtn.disabled = true;
        statusEl.textContent = "Analyzing handwriting... this may take a moment.";

        const formData = new FormData();
        formData.append("file", selectedFile);

        try {
          const resp = await fetch("/api/analyze", {
            method: "POST",
            body: formData,
          });

          const data = await resp.json();
          if (!resp.ok) {
            throw new Error(data.error || "Unknown error from server");
          }

          // Display rule-based traits
          const traits = data.rule_based_traits || {};
          traitsEl.innerHTML = "";
          Object.entries(traits).forEach(([name, value]) => {
            const pct = Math.max(0, Math.min(1, value)) * 100;
            const card = document.createElement("div");
            card.className = "trait-card";
            card.innerHTML = `
              <div class="trait-name">${name}</div>
              <div class="trait-score">${pct.toFixed(1)}%</div>
              <div class="bar-bg">
                <div class="bar-fill" style="width: ${pct}%;"></div>
              </div>
            `;
            traitsEl.appendChild(card);
          });

          // General interpretation for Big Five scores (simple and readable)
          interpretationEl.innerHTML = "";
          const interpTitle = document.createElement("div");
          interpTitle.className = "interpretation-title";
          interpTitle.textContent = "How to read your scores";
          interpretationEl.appendChild(interpTitle);

          const level = (v) =>
            v < 0.33 ? "low" : v < 0.66 ? "moderate" : "high";

          const list = document.createElement("ul");
          list.style.margin = "6px 0 0";
          list.style.paddingLeft = "18px";

          const addItem = (label, text) => {
            const li = document.createElement("li");
            li.textContent = `${label}: ${text}`;
            list.appendChild(li);
          };

          if (traits.openness !== undefined) {
            const l = level(traits.openness);
            if (l === "low") {
              addItem(
                "Openness (new ideas)",
                "you likely prefer familiar routines and practical approaches."
              );
            } else if (l === "moderate") {
              addItem(
                "Openness (new ideas)",
                "you balance trying new things with sticking to what works."
              );
            } else {
              addItem(
                "Openness (new ideas)",
                "you are probably imaginative, curious, and enjoy exploring new experiences."
              );
            }
          }
          if (traits.conscientiousness !== undefined) {
            const l = level(traits.conscientiousness);
            if (l === "low") {
              addItem(
                "Conscientiousness (organization)",
                "you may be more relaxed and spontaneous about plans and details."
              );
            } else if (l === "moderate") {
              addItem(
                "Conscientiousness (organization)",
                "you try to be responsible but still leave room for flexibility."
              );
            } else {
              addItem(
                "Conscientiousness (organization)",
                "you likely value structure, planning, and following through on tasks."
              );
            }
          }
          if (traits.extraversion !== undefined) {
            const l = level(traits.extraversion);
            if (l === "low") {
              addItem(
                "Extraversion (energy)",
                "you may feel more comfortable in quieter settings or with a few close people."
              );
            } else if (l === "moderate") {
              addItem(
                "Extraversion (energy)",
                "you can enjoy both social time and alone time depending on your mood."
              );
            } else {
              addItem(
                "Extraversion (energy)",
                "you probably enjoy being around people and feel energized by social situations."
              );
            }
          }
          if (traits.agreeableness !== undefined) {
            const l = level(traits.agreeableness);
            if (l === "low") {
              addItem(
                "Agreeableness (getting along)",
                "you may be more direct, competitive, or cautious about trusting others."
              );
            } else if (l === "moderate") {
              addItem(
                "Agreeableness (getting along)",
                "you balance standing up for yourself with cooperating with others."
              );
            } else {
              addItem(
                "Agreeableness (getting along)",
                "you likely value harmony, empathy, and supporting people around you."
              );
            }
          }
          if (traits.neuroticism !== undefined) {
            const l = level(traits.neuroticism);
            if (l === "low") {
              addItem(
                "Neuroticism (emotional sensitivity)",
                "you may handle stress well and usually feel emotionally steady."
              );
            } else if (l === "moderate") {
              addItem(
                "Neuroticism (emotional sensitivity)",
                "you sometimes feel stressed or worried, but can usually regain balance."
              );
            } else {
              addItem(
                "Neuroticism (emotional sensitivity)",
                "you might experience stronger emotions or worry more when under stress."
              );
            }
          }

          interpretationEl.appendChild(list);

          resultsEl.style.display = "block";
          statusEl.textContent = "Analysis complete.";
        } catch (err) {
          console.error(err);
          errorEl.textContent = err.message || "Error analyzing image.";
          statusEl.textContent = "";
        } finally {
          analyzeBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
